framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 5000
                    multiplier: 3
            failed: '%env(MESSENGER_FAILED_TRANSPORT_DSN)%'

        routing:
            App\Message\ProcessImport: async

when@test:
    framework:
        messenger:
            transports:
                async: 'test://'
                failed: 'test://'
